<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cluster Practice Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen console. Terminal on the left, a tabbed side panel (Guide, Cluster, Cheat sheet) on the right; stacks on phones. Single dark console look by choice. */
:root{
  color-scheme: dark;
  --bg:#0e1316; --panel:#141b1f; --panel2:#19232a; --line:#26343d;
  --ink:#d6e0dc; --dim:#82939a; --accent:#f0b44c; --accent-ink:#1b1408;
  --ok:#63c79c; --err:#ef7470; --warn:#e3925a; --info:#6db6e3; --dir:#7fb0ff;
  --n-idle:#2c4a44; --n-mix:#3f6f8c; --n-alloc:#2b4f6b; --n-drain:#6b4a2a; --n-down:#5d2c2c;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:10px}
*{box-sizing:border-box}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.02em}
.brand span{color:var(--dim);font-size:12px}
.sim{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim);white-space:nowrap}
.pill.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px}
.termwrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#0a0e10;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--dim);background:var(--panel)}
.tbar .host{color:var(--ink)}
.term{flex:1;overflow-y:auto;overflow-x:auto;padding:10px 12px 14px;font-family:var(--mono);font-size:13px;line-height:1.45;cursor:text}
.ln{white-space:pre;min-height:1.45em}
.ln.wrap{white-space:pre-wrap;word-break:break-word}
.err{color:var(--err)} .ok{color:var(--ok)} .tip{color:var(--accent)} .dimc{color:var(--dim)} .dirc{color:var(--dir);font-weight:600} .exe{color:var(--ok);font-weight:600} .info{color:var(--info)}
.pr{color:var(--ok)} .pr .h{color:var(--accent)}
.inline{display:flex;white-space:pre}
.inline input{flex:1;min-width:40px;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;padding:0;caret-color:var(--accent)}
.editor{position:absolute;inset:0;display:flex;flex-direction:column;background:#0a0e10;font-family:var(--mono);font-size:13px;z-index:5}
.ed-top{background:var(--ink);color:#0a0e10;padding:3px 10px;display:flex;justify-content:space-between;gap:10px}
.editor textarea{flex:1;resize:none;background:transparent;color:var(--ink);border:0;outline:0;font:inherit;line-height:1.45;padding:10px 12px;white-space:pre;overflow:auto}
.ed-msg{padding:3px 10px;min-height:1.6em;color:var(--accent)}
.ed-bar{display:flex;gap:6px 16px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
.ed-bar button{font-family:var(--mono);font-size:12px;padding:2px 8px}
.ed-bar kbd{background:var(--ink);color:#0a0e10;padding:0 3px;margin-right:4px;border-radius:2px}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 6px;color:var(--dim);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
h2{font-size:16px;margin:0;text-wrap:balance;font-weight:600}
h3{font-size:11px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
p{margin:0;line-height:1.5}
.lessons{display:flex;gap:4px;flex-wrap:wrap}
.lessons button{width:28px;height:28px;padding:0;font-family:var(--mono);font-size:12px}
.lessons button.done{background:color-mix(in srgb,var(--ok) 22%,var(--panel2));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.lessons button.cur{border-color:var(--accent);color:var(--accent)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;color:var(--dim);line-height:1.45}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px}
ol.steps li.done::before{content:"✓";color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
ol.steps li.cur{color:var(--ink)}
ol.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--mono);font-size:12.5px;background:#0a0e10;border:1px solid var(--line);border-radius:5px;padding:4px 8px;color:var(--accent);max-width:100%;overflow-x:auto;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.why{font-size:12.5px;color:var(--dim);margin-top:4px}
.track{font-family:var(--mono);font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;color:var(--dim)}
.navrow{display:flex;gap:8px;justify-content:space-between}
.done-card{border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:8px;padding:10px;background:color-mix(in srgb,var(--ok) 8%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:3px}
.node{aspect-ratio:1;border-radius:2px;background:var(--n-idle);max-width:100%}
.node.mix{background:linear-gradient(135deg,var(--n-mix) 50%,var(--n-idle) 50%)}
.node.alloc{background:var(--n-alloc)} .node.drain{background:var(--n-drain)} .node.down{background:var(--n-down)}
.node.mine{outline:2px solid var(--accent);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.part{display:flex;flex-direction:column;gap:6px}
.part .hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px}
.part .hd span{color:var(--dim)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.tblwrap{overflow-x:auto}
.st{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st.PENDING{color:var(--warn)} .st.RUNNING{color:var(--info)} .st.COMPLETED{color:var(--ok)} .st.FAILED,.st.TIMEOUT{color:var(--err)} .st.CANCELLED{color:var(--dim)}
.empty{color:var(--dim);font-size:13px}
.cheat{display:flex;flex-direction:column;gap:6px}
.cheat div{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:5px 0;border-bottom:1px solid var(--line)}
.cheat code{font-family:var(--mono);font-size:12.5px;color:var(--accent);cursor:pointer;overflow-x:auto;white-space:nowrap}
.cheat span{font-size:12.5px;color:var(--dim)}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}
@media (max-width:860px){
  body{height:auto;min-height:100%}
  html{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .termwrap{height:62vh}
  aside{max-height:none}
}
@media (prefers-reduced-motion:no-preference){ ol.steps li.done::before{transition:all .3s} }
</style>
</head>
<body>

<header>
  <div class="brand"><b>practice-cluster</b><span>A safe, simulated supercomputer for learning Slurm. Nothing here touches real hardware.</span></div>
  <div class="sim">
    <span class="pill live" id="clock">--</span>
    <span class="pill">1 second = 1 minute of cluster time</span>
    <button id="resetBtn" class="danger" type="button">Reset practice</button>
  </div>
</header>

<main>
  <section class="termwrap" aria-label="Terminal">
    <div class="tbar"><span>ssh</span><span class="host" id="tbHost">mudy@login01</span><span id="tbMods" style="margin-left:auto"></span></div>
    <div class="term" id="term"><div id="out"></div><div class="inline"><span id="prompt"></span><input id="cmd" aria-label="Command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div></div>
    <div class="editor" id="editor" hidden>
      <div class="ed-top"><span>GNU nano 6.4</span><span id="edName"></span><span id="edMod"></span></div>
      <textarea id="edText" spellcheck="false" aria-label="File editor"></textarea>
      <div class="ed-msg" id="edMsg"></div>
      <div class="ed-bar" id="edBar">
        <button type="button" id="edSave"><kbd>^S</kbd>Save</button>
        <button type="button" id="edExit"><kbd>^X</kbd>Exit</button>
      </div>
    </div>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-guide" aria-selected="true" type="button">Guide</button>
      <button role="tab" id="tab-cluster" aria-selected="false" type="button">Cluster</button>
      <button role="tab" id="tab-cheat" aria-selected="false" type="button">Cheat sheet</button>
    </div>
    <div class="pane" id="pane-guide"></div>
    <div class="pane" id="pane-cluster" hidden></div>
    <div class="pane" id="pane-cheat" hidden></div>
  </aside>
</main>

<script>
(function(){
"use strict";
const USER='mudy', HOME='/home/mudy', LOGIN='login01', SPEED=60, UID=5012;
const $=s=>document.querySelector(s);
const outEl=$('#out'), termEl=$('#term'), cmdEl=$('#cmd'), promptEl=$('#prompt');

/* ---------- time ---------- */
let simBase=Date.now(), realBase=Date.now();
const simMs=()=>simBase+(Date.now()-realBase)*SPEED;
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2=n=>String(n).padStart(2,'0');
function dateStr(ms){const d=new Date(ms);return `${DAYS[d.getDay()]} ${MONS[d.getMonth()]} ${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())} +03 ${d.getFullYear()}`}
function isoStr(ms){if(!ms)return 'Unknown';const d=new Date(ms);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
function lsDate(ms){const d=new Date(ms);return `${MONS[d.getMonth()]} ${String(d.getDate()).padStart(2,' ')} ${p2(d.getHours())}:${p2(d.getMinutes())}`}
function fmtElapsed(min){let s=Math.max(0,Math.floor(min*60));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  if(d)return `${d}-${p2(h)}:${p2(m)}:${p2(s)}`; if(h)return `${h}:${p2(m)}:${p2(s)}`; return `${m}:${p2(s)}`}
function fmtHMS(min){let s=Math.max(0,Math.round(min*60));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  return (d?d+'-':'')+`${p2(h)}:${p2(m)}:${p2(s)}`}
function parseTime(v){ if(v==null||v==='')return null; v=String(v).trim(); let d=0,rest=v;
  if(v.includes('-')){const [a,b]=v.split('-');d=+a;rest=b||'0'; const q=rest.split(':').map(Number); if(q.some(isNaN)||isNaN(d))return NaN; const [h=0,m=0,s=0]=q; return d*1440+h*60+m+s/60;}
  const q=rest.split(':').map(Number); if(q.some(isNaN))return NaN;
  if(q.length===1)return q[0]; if(q.length===2)return q[0]+q[1]/60; if(q.length===3)return q[0]*60+q[1]+q[2]/60; return NaN}
function parseMem(v){ if(v==null)return null; const m=String(v).trim().match(/^(\d+(?:\.\d+)?)([KMGT]?)B?$/i); if(!m)return NaN; const n=+m[1], u=(m[2]||'M').toUpperCase(); return u==='K'?n/1024:u==='M'?n:u==='G'?n*1024:n*1024*1024}
function fmtMem(mb){return mb>=1024?(mb%1024===0?mb/1024+'G':(mb/1024).toFixed(1)+'G'):Math.round(mb)+'M'}

/* ---------- random (seeded) ---------- */
let seed=20261021; function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const pick=a=>a[Math.floor(rnd()*a.length)];

/* ---------- file system ---------- */
const D=c=>({type:'d',c:c||{},m:Date.now()}), F=t=>({type:'f',t,m:Date.now()});
const README=`Welcome to the practice cluster
================================

This is a simulated Slurm cluster. Everything you do here is safe:
nothing runs on real hardware and you cannot break anything.
Use "Reset practice" (top right) to start over.

Two kinds of machines
  login01      where you land after ssh. Edit files, submit jobs.
               Do NOT run heavy programs here.
  compute nodes cn001-cn050, gpu01-gpu04, hm01-hm02.
               Your jobs run here, sent by the Slurm scheduler.

Folders
  ~/jobs       example job scripts (hello.sh, foldseek_search.sh, ...)
  ~/data       query structures for the Foldseek examples
  ~/results    where the example jobs write their output
  /scratch/mudy   large temporary space (purged after 30 days)
  /datasets/esm_atlas   shared, read-only copy of a Foldseek database

The daily loop
  1. write or edit a job script      nano myjob.sh
  2. submit it                       sbatch myjob.sh
  3. watch it                        squeue --me
  4. read the output                 cat slurm-<jobid>.out
  5. check what it used              seff <jobid>
`;
const HELLO=`#!/bin/bash
#SBATCH --job-name=hello
#SBATCH --partition=compute
#SBATCH --ntasks=1
#SBATCH --cpus-per-task=1
#SBATCH --mem=1G
#SBATCH --time=00:10:00

# A tiny first job. It prints where it ran, then waits 5 minutes.
echo "Hello from $(hostname)"
echo "Job ID: $SLURM_JOB_ID"
echo "Started: $(date)"
sleep 300
echo "Finished: $(date)"
`;
const FOLDSEEK=`#!/bin/bash
#SBATCH --job-name=fs_cdd
#SBATCH --partition=compute
#SBATCH --nodes=1
#SBATCH --ntasks=1
#SBATCH --cpus-per-task=16
#SBATCH --mem=32G
#SBATCH --time=02:00:00
#SBATCH --output=slurm-%j.out

# Search a bacterial cytidine deaminase (gemcitabine-inactivating)
# against the ESM Metagenomic Atlas Foldseek database.
module purge
module load foldseek

DB=/datasets/esm_atlas/foldseek/esm_atlas_hq
QUERY=$HOME/data/cdd_mhyorhinis.pdb
OUT=$HOME/results

mkdir -p $OUT
echo "Job $SLURM_JOB_ID started on $(hostname) at $(date)"
echo "Using $SLURM_CPUS_PER_TASK CPU cores"

foldseek easy-search $QUERY $DB $OUT/cdd_hits.m8 $TMPDIR --threads $SLURM_CPUS_PER_TASK -e 0.001

echo "Finished at $(date)"
`;
const BROKEN=`#!/bin/bash
#SBATCH --job-name=fs_gus
#SBATCH --partition=compute
#SBATCH --ntasks=1
#SBATCH --cpus-per-task=8
#SBATCH --mem=16G
#SBATCH --time=01:00:00

# Search a gut beta-glucuronidase (irinotecan toxicity).
# This script has a mistake. Run it, read the error, then fix it.
module purge

echo "Starting on $(hostname)"
foldseek easy-search $HOME/data/gus_ecoli.pdb /datasets/esm_atlas/foldseek/esm_atlas_hq $HOME/results/gus_hits.m8 $TMPDIR --threads 8
`;
const LONG=`#!/bin/bash
#SBATCH --job-name=long_run
#SBATCH --partition=compute
#SBATCH --ntasks=1
#SBATCH --cpus-per-task=4
#SBATCH --mem=8G
#SBATCH --time=02:00:00

# Pretends to work for 90 minutes. Good for practising scancel.
echo "Long job started on $(hostname)"
sleep 5400
echo "Long job finished"
`;
const GPU=`#!/bin/bash
#SBATCH --job-name=gpu_test
#SBATCH --partition=gpu
#SBATCH --gres=gpu:1
#SBATCH --cpus-per-task=8
#SBATCH --mem=32G
#SBATCH --time=00:20:00

# Ask for one GPU and show it.
module purge
module load cuda
echo "Running on $(hostname)"
nvidia-smi
sleep 120
`;
const PDB=(name,res)=>`HEADER    ${name}\nREMARK   1 Practice copy. Coordinates trimmed for the demo.\n`+
  res.map((r,i)=>`ATOM  ${String(i*4+1).padStart(5)}  CA  ${r} A${String(i+1).padStart(4)}    ${(10+i*1.3).toFixed(3).padStart(8)}${(5-i*.7).toFixed(3).padStart(8)}${(2+i*.4).toFixed(3).padStart(8)}  1.00 85.20           C`).join('\n')+'\n...\nEND\n';
function makeFS(){
  return D({
    home:D({mudy:D({
      'README.txt':F(README),
      jobs:D({'hello.sh':F(HELLO),'foldseek_search.sh':F(FOLDSEEK),'broken.sh':F(BROKEN),'long_job.sh':F(LONG),'gpu_test.sh':F(GPU)}),
      data:D({'cdd_mhyorhinis.pdb':F(PDB('CYTIDINE DEAMINASE, MYCOPLASMA HYORHINIS',['MET','LYS','ILE','GLU','CYS','HIS','ALA','GLU','ASN'])),
              'gus_ecoli.pdb':F(PDB('BETA-GLUCURONIDASE, ESCHERICHIA COLI',['MET','LEU','ARG','PRO','VAL','GLU','THR','PRO','TYR'])),
              'queries.txt':F('cdd_mhyorhinis.pdb  cytidine deaminase   gemcitabine\ngus_ecoli.pdb       beta-glucuronidase   irinotecan (SN-38G)\n')}),
      results:D()
    })}),
    scratch:D({mudy:D()}),
    datasets:D({esm_atlas:D({foldseek:D({
      'esm_atlas_hq':F('[binary Foldseek database, 36,912,557 high-quality predicted structures]\n'),
      'esm_atlas_hq.index':F('[binary index]\n'),
      'README':F('ESM Metagenomic Atlas, high-quality subset (pLDDT > 70), Foldseek format.\nShared read-only copy. Point your jobs at:\n  /datasets/esm_atlas/foldseek/esm_atlas_hq\n')})})}),
    tmp:D()
  });
}
let fs=makeFS();
function resolve(p,cwd){ if(p==null||p==='')return cwd; if(p==='~'||p.startsWith('~/'))p=HOME+p.slice(1); if(!p.startsWith('/'))p=cwd+'/'+p;
  const parts=[]; for(const s of p.split('/')){ if(!s||s==='.')continue; if(s==='..')parts.pop(); else parts.push(s);} return '/'+parts.join('/')}
function getN(path){ let n=fs; if(path==='/')return n; for(const s of path.slice(1).split('/')){ if(!n||n.type!=='d')return null; n=n.c[s]; } return n||null}
function parentOf(path){const i=path.lastIndexOf('/');return [i<=0?'/':path.slice(0,i),path.slice(i+1)]}
function writeFile(path,text,append){ const [dp,name]=parentOf(path); const d=getN(dp); if(!d||d.type!=='d'||!name)return false;
  const ex=d.c[name]; if(ex&&ex.type==='d')return false; if(ex&&append){ex.t+=text;ex.m=simMs()} else d.c[name]={type:'f',t:text,m:simMs()}; return true}
function mkdirp(path){ let n=fs; for(const s of path.split('/').filter(Boolean)){ if(!n.c[s])n.c[s]=D(); n=n.c[s]; if(n.type!=='d')return false;} return true}
function readOnly(path){return path.startsWith('/datasets')}
function canWrite(path){return path.startsWith(HOME)||path.startsWith('/scratch/mudy')||path.startsWith('/tmp')}

/* ---------- modules ---------- */
const MODS={'foldseek':['9.427df8a','8.ef4e960'],'mmseqs2':['15-6f452'],'python':['3.11.7','3.9.18'],'anaconda3':['2024.02'],'gcc':['12.2.0','11.3.0'],
  'openmpi':['4.1.5'],'cuda':['12.2','11.8'],'blast+':['2.15.0'],'hmmer':['3.4'],'R':['4.3.2'],'autodock-vina':['1.2.5'],'pymol':['2.5.0']};

function hostlist(names){ if(!names.length)return ''; const g={}; for(const nm of names){const m=nm.match(/^([a-z]+)(\d+)$/); if(!m){(g[nm]=g[nm]||[]);continue} (g[m[1]]=g[m[1]]||[]).push(m[2]);}
  const outp=[]; for(const pre in g){ const nums=g[pre].sort((a,b)=>+a-+b); if(!nums.length){outp.push(pre);continue} if(nums.length===1){outp.push(pre+nums[0]);continue}
    const rs=[]; let s=nums[0],e=nums[0]; for(let i=1;i<=nums.length;i++){ if(i<nums.length&&+nums[i]===+e+1){e=nums[i];continue} rs.push(s===e?s:s+'-'+e); if(i<nums.length){s=e=nums[i]} }
    outp.push(pre+'['+rs.join(',')+']'); } return outp.join(',')}

function bgChurn(){ if(!bgRun.length)return; const j=bgRun[Math.floor(rnd()*bgRun.length)]; const ns=j.nodelist.map(nodeByName);
  ns.forEach(n=>{n.used-=j.cpn;n.gused-=j.gpn;n.jobs=n.jobs.filter(x=>x!==j.id)}); bgRun=bgRun.filter(x=>x!==j);

/* ---------- tokenizer ---------- */
function expand(str,env,dateMs){
  // leave single-quoted parts alone
  return str.split(/('[^']*')/).map(seg=>{ if(seg.startsWith("'"))return seg;
    return seg.replace(/\$\((hostname|date|whoami|nproc|pwd)\)/g,(m,c)=>c==='hostname'?env.HOSTNAME:c==='date'?dateStr(dateMs||simMs()):c==='whoami'?USER:c==='nproc'?String(env.SLURM_CPUS_PER_TASK||(env.HOSTNAME===LOGIN?4:1)):env.PWD)
      .replace(/\$\{(\w+)\}|\$(\w+)/g,(m,a,b)=>{const k=a||b; return env[k]!=null?String(env[k]):''}); }).join('');
}
function tokenize(str){ const toks=[]; let cur='',q=null,has=false;
  const push=()=>{ if(has||cur){toks.push({w:cur})} cur='';has=false };
  for(let i=0;i<str.length;i++){ const c=str[i];
    if(q){ if(c===q)q=null; else cur+=c; continue }
    if(c==='"'||c==="'"){q=c;has=true;continue}
    if(c===' '||c==='\t'){push();continue}
    if(c==='|'||c===';'){ push(); if(c==='|'&&str[i+1]==='|'){toks.push({op:'||'});i++} else toks.push({op:c}); continue }
    if(c==='&'&&str[i+1]==='&'){push();toks.push({op:'&&'});i++;continue}
    if(c==='>'){ push(); if(str[i+1]==='>'){toks.push({op:'>>'});i++} else toks.push({op:'>'}); continue }
    cur+=c; }
  push(); return toks }

/* ---------- command runner ---------- */
function shellEnv(){ const env={USER,HOME,PWD:shell.cwd,HOSTNAME:shell.host,SHELL:'/bin/bash',...shell.vars};
  if(shell.ijob){const j=shell.ijob; Object.assign(env,{SLURM_JOB_ID:j.id,SLURM_CPUS_PER_TASK:j.cpt,SLURM_NTASKS:j.ntasks,SLURM_JOB_NODELIST:hostlist(j.nodelist),TMPDIR:'/tmp/'+j.id})}
  return env }
function execLine(line){
  print([...promptParts(),[line,'']]);
  if(line.trim()){ shell.history.push(line); if(shell.history.length>300)shell.history.shift(); }
  shell.hidx=shell.history.length;
  if(!line.trim()){ return }
  const toks=tokenize(expand(line,shellEnv()));
  // split into command lists by ; && ||
  let lists=[[]], ops=[]; for(const t of toks){ if(t.op===';'||t.op==='&&'||t.op==='||'){ops.push(t.op);lists.push([])} else lists[lists.length-1].push(t) }
  let last=0;
  lists.forEach((lt,i)=>{ if(i>0){ if(ops[i-1]==='&&'&&last!==0)return; if(ops[i-1]==='||'&&last===0)return; } if(lt.length) last=runPipeline(lt) });
  save();
}
function runPipeline(toks){
  let redir=null; const ri=toks.findIndex(t=>t.op==='>'||t.op==='>>');
  if(ri>=0){ const target=toks[ri+1]; if(!target||target.op){print('bash: syntax error near unexpected token `newline\'','err');return 2} redir={append:toks[ri].op==='>>',path:resolve(target.w,shell.cwd)}; toks=toks.slice(0,ri).concat(toks.slice(ri+2)) }
  const segs=[[]]; for(const t of toks){ if(t.op==='|')segs.push([]); else if(t.w!=null)segs[segs.length-1].push(t.w) }
  let stdin=null, code=0;
  const capture=segs.length>1||redir;
  segs.forEach((argv,idx)=>{ if(!argv.length)return; const isLast=idx===segs.length-1;
    const prev=sink; if(capture&&!(isLast&&!redir))sink=[]; else if(capture&&isLast&&redir) sink=[];
    code=runCmd(argv,stdin);
    if(capture){ if(isLast&&!redir){} else { stdin=sink.join('\n'); } }
    sink=prev; });
  if(redir){ if(!canWrite(redir.path)){print(`bash: ${redir.path}: Permission denied`,'err');return 1}
    if(!writeFile(redir.path,(stdin||'')+(stdin?'\n':''),redir.append)){print(`bash: ${redir.path}: No such file or directory`,'err');return 1} }
  return code }

function runCmd(argv,stdin){
  const [cmd,...args]=argv;
  // VAR=value
  const asg=cmd.match(/^([A-Za-z_]\w*)=(.*)$/); if(asg&&!args.length){ shell.vars[asg[1]]=asg[2]; return 0 }
  const fn=CMDS[cmd];
  let code;
  if(fn) code=fn(args,stdin);
  else if(HEAVY.includes(cmd)) code=heavyShell(cmd,args);
  else { print(`bash: ${cmd}: command not found`,'err'); if(/^(qsub|qstat|qdel|pbsnodes)$/.test(cmd)) print('Tip: qsub/qstat are PBS commands. This practice cluster uses Slurm: sbatch, squeue, scancel.','tip'); code=127 }
  emit({type:'cmd',cmd,args,ok:code===0,cwd:shell.cwd,host:shell.host});
  return code }

let edPath=null, edOrig='', edConfirm=false;
const edEl=$('#editor'), edText=$('#edText');
function openEditor(path,text){ edPath=path; edOrig=text; edText.value=text; edConfirm=false; $('#edName').textContent=path.replace(HOME,'~'); $('#edMod').textContent=''; $('#edMsg').textContent=getN(path)?`[ Read ${text.split('\n').length} lines ]`:'[ New File ]';
  edEl.hidden=false; setTimeout(()=>edText.focus(),0); }
function edSave(){ if(readOnly(edPath)||!canWrite(edPath)){ $('#edMsg').textContent='[ Error writing '+edPath+': Permission denied ]'; return false }
  writeFile(edPath,edText.value); edOrig=edText.value; $('#edMod').textContent=''; $('#edMsg').textContent=`[ Wrote ${edText.value.split('\n').length} lines ]`; emit({type:'save',path:edPath,text:edText.value}); save(); return true }
function edExit(force){ if(!force&&edText.value!==edOrig&&!edConfirm){ edConfirm=true; $('#edMsg').innerHTML=''; const m=$('#edMsg');
    m.append('Save modified buffer?  '); const y=document.createElement('button');y.type='button';y.textContent='Y  Yes';y.onclick=()=>{if(edSave())edExit(true)}; const n=document.createElement('button');n.type='button';n.textContent='N  No';n.onclick=()=>edExit(true); const c=document.createElement('button');c.type='button';c.textContent='Cancel';c.onclick=()=>{edConfirm=false;m.textContent='';edText.focus()};
    m.append(y,' ',n,' ',c); return }
  edEl.hidden=true; edPath=null; cmdEl.focus(); scrollEnd() }
edText.addEventListener('input',()=>{$('#edMod').textContent=edText.value!==edOrig?'Modified':''});
edText.addEventListener('keydown',e=>{ if(e.ctrlKey&&(e.key==='s'||e.key==='o')){e.preventDefault();edSave()} else if(e.ctrlKey&&e.key==='x'){e.preventDefault();edExit()} else if(edConfirm&&!e.ctrlKey&&(e.key==='y'||e.key==='Y')){e.preventDefault();if(edSave())edExit(true)} else if(edConfirm&&(e.key==='n'||e.key==='N')){e.preventDefault();edExit(true)}
  else if(e.key==='Tab'){e.preventDefault(); const s=edText.selectionStart; edText.setRangeText('    ',s,edText.selectionEnd,'end'); edText.dispatchEvent(new Event('input'))} });
$('#edSave').onclick=()=>{edSave();edText.focus()}; $('#edExit').onclick=()=>edExit();

/* ---------- input ---------- */
cmdEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const v=cmdEl.value; cmdEl.value=''; execLine(v); scrollEnd() }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(shell.hidx>0){shell.hidx--;cmdEl.value=shell.history[shell.hidx]||''} }
  else if(e.key==='ArrowDown'){ e.preventDefault(); if(shell.hidx<shell.history.length){shell.hidx++;cmdEl.value=shell.history[shell.hidx]||''} }
  else if(e.key==='Tab'){ e.preventDefault(); complete() }
  else if(e.ctrlKey&&e.key==='l'){ e.preventDefault(); outEl.innerHTML='' }
  else if(e.ctrlKey&&e.key==='c'){ e.preventDefault(); print([...promptParts(),[cmdEl.value+'^C','']]); cmdEl.value=''; scrollEnd() } });
termEl.addEventListener('click',()=>{ if(!window.getSelection().toString())cmdEl.focus() });
function complete(){ const v=cmdEl.value; const m=v.match(/(\S*)$/); const word=m[1]; const isFirst=!v.slice(0,v.length-word.length).trim();
  let cands=[];
  if(isFirst&&!word.includes('/')) cands=Object.keys(CMDS).concat(HEAVY).filter(c=>c.startsWith(word));
  else { const slash=word.lastIndexOf('/'); const dirPart=slash>=0?word.slice(0,slash+1):''; const base=word.slice(slash+1); const d=getN(resolve(dirPart||'.',shell.cwd));
    if(d&&d.type==='d') cands=Object.keys(d.c).filter(k=>k.startsWith(base)).map(k=>dirPart+k+(d.c[k].type==='d'?'/':'')) }
  if(cands.length===1){ cmdEl.value=v.slice(0,v.length-word.length)+cands[0]+(cands[0].endsWith('/')?'':' ') }
  else if(cands.length>1){ let pre=cands[0]; cands.forEach(c=>{while(!c.startsWith(pre))pre=pre.slice(0,-1)}); if(pre.length>word.length)cmdEl.value=v.slice(0,v.length-word.length)+pre; else { print([...promptParts(),[v,'']]); print(cands.map(c=>c.split('/').filter(Boolean).pop()+(c.endsWith('/')?'/':'')).join('  ')); scrollEnd() } } }

/* ---------- guide ---------- */
const jobIs=(id,st)=>{const j=findUserJob(id);return j&&(st?st.includes(j.state):['COMPLETED','FAILED','TIMEOUT','CANCELLED'].includes(j.state))};
const fileIs=(e,name)=>e.args.some(a=>a.endsWith(name));
const LESSONS=[
 {title:'Find your way around',intro:'You have just logged in to the login node. This is the shared front door of the cluster, where you look at files and submit work.',steps:[
   {text:'Print the folder you are in.',cmd:'pwd',ok:e=>e.cmd==='pwd'},
   {text:'List the files in it.',cmd:'ls',ok:e=>e.cmd==='ls'&&e.ok},
   {text:'Read the welcome notes.',cmd:'cat README.txt',ok:e=>['cat','less','more'].includes(e.cmd)&&fileIs(e,'README.txt')&&e.ok},
   {text:'Move into the jobs folder.',cmd:'cd jobs',ok:e=>e.cmd==='cd'&&e.cwd===HOME+'/jobs'},
   {text:'List the job scripts with details. Green names are scripts.',cmd:'ls -l',ok:e=>e.cmd==='ls'&&e.cwd===HOME+'/jobs'}]},
 {title:'Load software with modules',intro:'Clusters install hundreds of programs. None are active until you load them with the module command.',steps:[
   {text:'See which software is installed.',cmd:'module avail',ok:e=>(e.cmd==='module'||e.cmd==='ml')&&/^av/.test(e.args[0]||'')},
   {text:'Try to run Foldseek before loading it. You will get "command not found".',cmd:'foldseek version',ok:e=>e.cmd==='foldseek'},
   {text:'Load Foldseek.',cmd:'module load foldseek',ok:e=>hasMod(shell.modules,'foldseek')&&(e.cmd==='module'||e.cmd==='ml')},
   {text:'Check what is loaded now. Running foldseek version works too.',cmd:'module list',ok:e=>(e.cmd==='module'&&e.args[0]==='list')||(e.cmd==='ml'&&!e.args.length)}]},
 {title:'Look at the cluster',intro:'Before you ask for resources, see what exists and how busy it is. The Cluster tab on the right shows the same thing as a picture.',steps:[
   {text:'See the partitions (groups of nodes) and their states.',cmd:'sinfo',ok:e=>e.cmd==='sinfo'&&e.ok,why:'mix = partly used, alloc = full, idle = free, drain/down = out of service.'},
   {text:'See every job in the queue.',cmd:'squeue',ok:e=>e.cmd==='squeue'&&e.ok,why:'ST: PD means pending (waiting), R means running.'},
   {text:'Show only your own jobs. It is empty for now.',cmd:'squeue --me',ok:e=>e.cmd==='squeue'&&(e.args.includes('--me')||e.args.includes(USER))}]},
 {title:'Submit your first job',intro:'A job script is a normal shell script with #SBATCH lines at the top that ask for resources.',steps:[
   {text:'Make sure you are in the jobs folder, then read hello.sh.',cmd:'cat hello.sh',ok:e=>e.cmd==='cat'&&fileIs(e,'hello.sh')&&e.ok},
   {text:'Submit it to the scheduler.',cmd:'sbatch hello.sh',ok:e=>e.type==='submit'&&e.job.scriptPath.endsWith('hello.sh'),track:true},
   {text:'Check on it. Run this a few times and watch PD turn into R.',cmd:'squeue --me',ok:e=>e.cmd==='squeue'},
   {text:'Wait until it finishes (about 10 seconds), then list the folder. A new slurm-{job}.out file appears.',cmd:'ls',ok:e=>e.cmd==='ls'&&jobIs(tut.vars.job)},
   {text:'Read the job output.',cmd:'cat slurm-{job}.out',ok:e=>['cat','less','more','tail','head'].includes(e.cmd)&&fileIs(e,`slurm-${tut.vars.job}.out`)&&e.ok}]},
 {title:'Run a Foldseek search',intro:'Now a realistic job: search a cytidine deaminase that inactivates gemcitabine against the ESM Metagenomic Atlas.',steps:[
   {text:'Open the Foldseek job script in the editor.',cmd:'nano foldseek_search.sh',ok:e=>['nano','vim','vi','edit'].includes(e.cmd)&&fileIs(e,'foldseek_search.sh')},
   {text:'Change --cpus-per-task=16 to 32 so it runs faster. Save with Ctrl+S, then exit with Ctrl+X.',ok:e=>e.type==='save'&&e.path.endsWith('foldseek_search.sh'),why:'More cores make Foldseek faster because the script passes $SLURM_CPUS_PER_TASK to --threads.'},
   {text:'Submit it.',cmd:'sbatch foldseek_search.sh',ok:e=>e.type==='submit'&&e.job.scriptPath.endsWith('foldseek_search.sh'),track:true},
   {text:'Look at the full details Slurm keeps for your job.',cmd:'scontrol show job {job}',ok:e=>e.cmd==='scontrol'&&e.args.includes(String(tut.vars.job))},
   {text:'Peek at the log while it runs. Repeat to see it grow.',cmd:'tail slurm-{job}.out',ok:e=>['tail','cat','less','head'].includes(e.cmd)&&fileIs(e,`slurm-${tut.vars.job}.out`)&&e.ok},
   {text:'When the job has finished, look at the top structural hits.',cmd:'head ~/results/cdd_hits.m8',ok:e=>['head','cat','less','tail','more'].includes(e.cmd)&&fileIs(e,'cdd_hits.m8')&&e.ok,why:'Columns: query, target, identity, alignment length, mismatches, gaps, query start/end, target start/end, E-value, bit score.'},
   {text:'Check how well the job used what it asked for.',cmd:'seff {job}',ok:e=>e.cmd==='seff'&&e.args.includes(String(tut.vars.job))&&jobIs(tut.vars.job)}]},
 {title:'Fix a failed job',intro:'Jobs fail. The skill is reading the evidence: the job state, the exit code, and the log.',steps:[
   {text:'Submit the broken script.',cmd:'sbatch broken.sh',ok:e=>e.type==='submit'&&e.job.scriptPath.endsWith('broken.sh'),track:true},
   {text:'Wait for it to end, then check its state and exit code.',cmd:'sacct',ok:e=>e.cmd==='sacct'&&jobIs(tut.vars.job)},
   {text:'Read the log to find out why.',cmd:'cat slurm-{job}.out',ok:e=>['cat','less','tail','more','head'].includes(e.cmd)&&fileIs(e,`slurm-${tut.vars.job}.out`)&&e.ok,why:'Exit code 127 always means "command not found".'},
   {text:'Open broken.sh and add the line  module load foldseek  under module purge. Save and exit.',cmd:'nano broken.sh',ok:e=>e.type==='save'&&e.path.endsWith('broken.sh')&&/^\s*(module load|ml)\s+foldseek/m.test(e.text)},
   {text:'Submit the fixed script.',cmd:'sbatch broken.sh',ok:e=>e.type==='submit'&&e.job.scriptPath.endsWith('broken.sh'),track:true},
   {text:'Confirm it completed this time. With 8 cores the search takes about 45 seconds, so run sacct again until it says COMPLETED.',cmd:'sacct -j {job}',ok:e=>e.cmd==='sacct'&&jobIs(tut.vars.job,['COMPLETED'])}]},
 {title:'Cancel and work interactively',intro:'Two last everyday skills: stopping a job you no longer want, and getting a shell on a compute node to test things.',steps:[
   {text:'Submit a long job.',cmd:'sbatch long_job.sh',ok:e=>e.type==='submit'&&e.job.scriptPath.endsWith('long_job.sh'),track:true},
   {text:'Cancel it.',cmd:'scancel {job}',ok:e=>e.cmd==='scancel'&&jobIs(tut.vars.job,['CANCELLED'])},
   {text:'Ask for an interactive shell on a debug node for 30 minutes.',cmd:'srun -p debug --time=00:30:00 --pty bash',ok:e=>e.cmd==='srun'&&!!shell.ijob},
   {text:'Check which machine you are on now.',cmd:'hostname',ok:e=>e.cmd==='hostname'&&e.host!==LOGIN},
   {text:'Leave the compute node and go back to the login node.',cmd:'exit',ok:e=>(e.cmd==='exit'||e.cmd==='logout')&&e.host===LOGIN}]}
];
let tut={l:0,s:0,vars:{},done:{}};
function tutEvent(ev){ const L=LESSONS[tut.l]; if(!L)return; const st=L.steps[tut.s]; if(!st)return;
  if(ev.type==='submit'&&st.track){ /* set before ok check */ }
  if(st.ok(ev)){ if(ev.type==='submit'&&st.track)tut.vars.job=ev.job.id; tut.s++; if(tut.s>=L.steps.length){ tut.done[tut.l]=true; if(tut.l<LESSONS.length-1){ tut.justDone=L.title; tut.l++; tut.s=0 } } renderGuide(); save() } }
function fillVars(s){ return s.replace(/\{job\}/g,tut.vars.job||'<jobid>') }
function renderGuide(){ const pane=$('#pane-guide'); pane.innerHTML=''; const L=LESSONS[tut.l];
  const top=document.createElement('div'); top.style.cssText='display:flex;flex-direction:column;gap:8px';
  top.innerHTML=`<h3>Lesson ${tut.l+1} of ${LESSONS.length}</h3>`; const row=document.createElement('div'); row.className='lessons';
  LESSONS.forEach((x,i)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=i+1; b.title=x.title; b.className=(tut.done[i]?'done ':'')+(i===tut.l?'cur':''); b.onclick=()=>{tut.l=i;tut.s=tut.done[i]?x.steps.length:0;renderGuide();save()}; row.appendChild(b) });
  top.appendChild(row); pane.appendChild(top);
  if(tut.justDone&&tut.s===0){ const d=document.createElement('div'); d.className='done-card'; d.innerHTML='<p><b>✓ Lesson complete:</b> '+esc(tut.justDone)+'. On to the next one.</p>'; pane.appendChild(d) } else tut.justDone=null;
  const h=document.createElement('h2'); h.textContent=L.title; pane.appendChild(h);
  const p=document.createElement('p'); p.className='note'; p.textContent=L.intro; pane.appendChild(p);
  const ol=document.createElement('ol'); ol.className='steps';
  L.steps.forEach((st,i)=>{ const li=document.createElement('li'); li.className=i<tut.s?'done':i===tut.s?'cur':''; const div=document.createElement('div');
    const t=document.createElement('div'); t.textContent=fillVars(st.text); div.appendChild(t);
    if(i===tut.s){ if(st.cmd){ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.title='Put this command in the terminal'; c.textContent='$ '+fillVars(st.cmd); c.onclick=()=>{cmdEl.value=fillVars(st.cmd);cmdEl.focus()}; div.appendChild(c) }
      if(st.why){ const w=document.createElement('div'); w.className='why'; w.textContent=st.why; div.appendChild(w) } }
    li.appendChild(div); ol.appendChild(li) });
  pane.appendChild(ol);
  if(tut.vars.job&&tut.s<L.steps.length){ const j=findUserJob(tut.vars.job); if(j){ const tr=document.createElement('div'); tr.className='track'; tr.id='trackLine'; pane.appendChild(tr); updateTrack() } }
  if(tut.s>=L.steps.length){ const d=document.createElement('div'); d.className='done-card';
    d.innerHTML=tut.l<LESSONS.length-1?`<p><b>Lesson complete.</b> Next: ${LESSONS[tut.l+1].title}.</p>`:`<p><b>All lessons complete.</b> You have used the full Slurm workflow. Try writing your own script with nano myjob.sh, or ask for a GPU with gpu_test.sh.</p>`;
    if(tut.l<LESSONS.length-1){ const b=document.createElement('button'); b.type='button'; b.textContent='Start next lesson'; b.style.marginTop='8px'; b.onclick=()=>{tut.l++;tut.s=0;renderGuide();save()}; d.appendChild(b) }
    pane.appendChild(d) }
  const nav=document.createElement('div'); nav.className='navrow';
  const sk=document.createElement('button'); sk.type='button'; sk.textContent='Skip this step'; sk.disabled=tut.s>=L.steps.length; sk.onclick=()=>{ tut.s++; if(tut.s>=L.steps.length)tut.done[tut.l]=true; renderGuide(); save() };
  const rs=document.createElement('button'); rs.type='button'; rs.textContent='Restart lesson'; rs.onclick=()=>{tut.s=0;renderGuide();save()};
  nav.append(rs,sk); pane.appendChild(nav);
  const n=document.createElement('p'); n.className='note'; n.textContent='Practice notes: the real KAU cluster may use different partition names, limits and module versions. Check its user guide before your first real job.'; pane.appendChild(n) }
function updateTrack(){ const tr=$('#trackLine'); if(!tr)return; const j=findUserJob(tut.vars.job); if(!j)return; const el=j.start?((j.end||simMs())-j.start)/60000:0;
  tr.textContent=`Job ${j.id} (${j.name}): ${j.state}${j.state==='RUNNING'?' for '+fmtElapsed(el):''}${j.state==='PENDING'?' · reason '+j.reason:''}` }

/* ---------- side panels ---------- */
let lastSide=0;
function renderSideThrottled(force){ const now=Date.now(); if(force||now-lastSide>1000){ lastSide=now; renderSide() } }
function renderSide(){ updateTrack(); if(!$('#pane-cluster').hidden)renderCluster() }
function renderCluster(){ const pane=$('#pane-cluster'); const mineNodes=new Set(userJobs.filter(j=>j.state==='RUNNING').flatMap(j=>j.nodelist));
  let html='<div class="legend"><span><i style="background:var(--n-idle)"></i>idle</span><span><i style="background:linear-gradient(135deg,var(--n-mix) 50%,var(--n-idle) 50%)"></i>mix</span><span><i style="background:var(--n-alloc)"></i>alloc</span><span><i style="background:var(--n-drain)"></i>drain</span><span><i style="background:var(--n-down)"></i>down</span><span><i style="outline:2px solid var(--accent);outline-offset:-1px;background:transparent"></i>your job</span></div>';
  PARTS.forEach(p=>{ const ns=nodes.filter(n=>n.part===p.name); const used=ns.reduce((a,n)=>a+n.used,0), tot=ns.filter(n=>!n.admin).reduce((a,n)=>a+n.cpus,0);
    html+=`<div class="part"><div class="hd"><b>${p.name}${p.def?' (default)':''}</b><span>${ns.length} nodes · ${used}/${tot} cores busy · max ${p.max>=1440?p.max/1440+' days':p.max+' min'}</span></div><div class="grid">`+
      ns.map(n=>`<div class="node ${nodeState(n)}${mineNodes.has(n.name)?' mine':''}" title="${n.name}: ${nodeState(n)}, ${n.used}/${n.cpus} cores${n.gpus?', '+n.gused+'/'+n.gpus+' GPUs':''}"></div>`).join('')+'</div></div>' });
  const mine=userJobs.slice(-8).reverse(); const now=simMs();
  html+='<h3>Your jobs</h3>';
  if(!mine.length)html+='<p class="empty">No jobs yet. Submit one with <code>sbatch hello.sh</code> from the jobs folder.</p>';
  else html+='<div class="tblwrap"><table><thead><tr><th>Job</th><th>Name</th><th>State</th><th>Time</th></tr></thead><tbody>'+mine.map(j=>{const el=j.start?((j.end||now)-j.start)/60000:0;return `<tr><td>${j.id}</td><td>${esc(j.name)}</td><td><span class="st ${j.state}">${j.state}</span></td><td>${fmtElapsed(el)}</td></tr>`}).join('')+'</tbody></table></div>';
  const q=allQueue(); html+=`<p class="note">Queue right now: ${q.filter(r=>r.st==='R').length} running, ${q.filter(r=>r.st==='PD').length} pending, from ${new Set(q.map(r=>r.user)).size} users.</p>`;
  pane.innerHTML=html }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderCheat(){ const groups=[
  ['Moving around',[['pwd','Show the current folder'],['ls -l','List files with details'],['cd jobs','Enter a folder (cd .. goes up, cd ~ goes home)'],['cat file','Print a file'],['tail -n 20 file','Last 20 lines of a file'],['nano file','Edit a file (Ctrl+S save, Ctrl+X exit)']]],
  ['Software',[['module avail','List installed software'],['module load foldseek','Make a program available'],['module list','What is loaded'],['module purge','Unload everything']]],
  ['Jobs',[['sbatch job.sh','Submit a job script'],['squeue --me','Your queued and running jobs'],['scancel <jobid>','Cancel a job'],['sacct','History of your jobs, with exit codes'],['seff <jobid>','How much CPU and memory a job used'],['scontrol show job <jobid>','Every detail about one job']]],
  ['The cluster',[['sinfo','Partitions and node states'],['sinfo -N -p gpu','Each node in one partition'],['squeue','Everyone\'s jobs'],['srun -p debug --pty bash','Interactive shell on a compute node']]],
  ['#SBATCH options',[['--job-name=name','Name shown in squeue'],['--partition=compute','Which group of nodes'],['--cpus-per-task=16','Cores for a multithreaded program'],['--mem=32G','Memory per node'],['--time=02:00:00','Wall-time limit (job is killed after it)'],['--gres=gpu:1','One GPU (gpu partition only)'],['--output=slurm-%j.out','Log file; %j becomes the job ID']]] ];
  const pane=$('#pane-cheat'); pane.innerHTML='<p class="note">Click a command to put it in the terminal.</p>'+groups.map(([g,items])=>`<h3>${g}</h3><div class="cheat">`+items.map(([c,d])=>`<div><code data-c="${esc(c)}">${esc(c)}</code><span>${esc(d)}</span></div>`).join('')+'</div>').join('');
  pane.querySelectorAll('code').forEach(c=>c.onclick=()=>{ if(c.dataset.c.startsWith('--'))return; cmdEl.value=c.dataset.c.replace(/ <jobid>| file$/,m=>m===' file'?' ':' '); cmdEl.focus() }) }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b)); ['guide','cluster','cheat'].forEach(k=>$('#pane-'+k).hidden=b.id!=='tab-'+k); if(b.id==='tab-cluster')renderCluster() });

/* ---------- persistence ---------- */
const KEY='practice-cluster-v1';
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({fs,userJobs:userJobs.map(j=>({...j})),nextId,tut,history:shell.history.slice(-100),cwd:shell.cwd,sim:simMs(),seed})) }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(!s)return false; fs=s.fs; userJobs=s.userJobs||[]; nextId=s.nextId; tut=s.tut||tut; shell.history=s.history||[]; shell.hidx=shell.history.length; shell.cwd=getN(s.cwd)?s.cwd:HOME; simBase=s.sim; realBase=Date.now(); seed=s.seed||seed; return true }catch(e){ return false } }
function motd(){ const now=simMs(); [
  `Last login: ${dateStr(now-38*60000*60/SPEED).replace(' +03','')} from 10.12.4.27`,
  '=======================================================================',
  '  PRACTICE CLUSTER   simulated Slurm environment for training',
  '  Nothing here runs on real hardware. 1 second = 1 minute of cluster time.',
  '-----------------------------------------------------------------------',
  '  Login node : login01   (edit and submit here, do not compute here)',
  '  Partitions : compute (default) · gpu · highmem · debug',
  '  Storage    : /home/mudy 50 GB backed up · /scratch/mudy 2 TB, purged',
  '  New here?  Follow the Guide on the right, or type  help',
  '======================================================================='].forEach((l,i)=>print(l,i===0?'dimc':i===2?'tip':'')); }

/* ---------- reset ---------- */
let resetArm=null; $('#resetBtn').onclick=()=>{ const b=$('#resetBtn'); if(!resetArm){ b.textContent='Click again to erase all practice'; resetArm=setTimeout(()=>{resetArm=null;b.textContent='Reset practice'},3500); return }
  clearTimeout(resetArm); resetArm=null; b.textContent='Reset practice'; try{localStorage.removeItem(KEY)}catch(e){}
  fs=makeFS(); userJobs=[]; nextId=4815162; seed=20261021; tut={l:0,s:0,vars:{},done:{}}; Object.assign(shell,{cwd:HOME,host:LOGIN,modules:[],vars:{},ijob:null,history:[],hidx:0}); simBase=Date.now(); realBase=Date.now();
  initBg(); outEl.innerHTML=''; motd(); renderPrompt(); renderGuide(); renderSide(); cmdEl.focus() };

/* ---------- boot ---------- */
const restored=load();
initBg();
// re-apply allocations for jobs that were running
userJobs.forEach(j=>{ if(j.state==='RUNNING'){ if(j.interactive){ j.state='COMPLETED'; j.end=simMs(); j.exit='0:0'; return } j.nodelist.forEach(nm=>{const n=nodeByName(nm); if(n){n.used+=j.cpn;n.gused+=j.gpus;n.jobs.push(j.id)}}) } });
motd(); if(restored)print('(Your earlier practice session was restored. Use "Reset practice" to start fresh.)','dimc');
renderPrompt(); renderGuide(); renderCheat(); renderSide();
setInterval(tick,500); tick();
cmdEl.focus();
})();
</script>
